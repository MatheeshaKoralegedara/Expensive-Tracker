spring.application.name=ExpensiveTracker

server.port=${PORT:8080}

# =====================
# DATABASE
# Set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD on the host (Render, etc.)
# MySQL:      jdbc:mysql://host:3306/dbname
# PostgreSQL: jdbc:postgresql://host:5432/dbname
# Driver is detected automatically from the URL.
# =====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expense_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =====================
# EMAIL (GMAIL)
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${SPRING_MAIL_FROM:noreply@spendwise.com}

# =====================
# FRONTEND
# =====================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
# Comma-separated list of origins allowed to call the API (wildcards allowed)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*.*:3000,https://*.vercel.app}
