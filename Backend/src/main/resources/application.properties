# Database Configuration - Uses Railway's provided environment variables
# These variables (e.g., MYSQL_URL, MYSQLUSER) are automatically available in your Railway service.
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email Configuration - Use environment variables for security
# Set these variables in your Railway service settings.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${SPRING_MAIL_FROM:noreply@spendwise.com}

# Application URL for Email Links - Set this to your deployed frontend URL in Railway
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

